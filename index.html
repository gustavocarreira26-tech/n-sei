<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>smalvile/fan base</title>
    
    <style>
        /* RESET DE ESTILOS PADRÃO */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b); /* Fundo escuro estético */
            height: 200vh;
        }

        /* 👑 ESTILIZAÇÃO DO CABEÇALHO */
        .custom-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 5%; /* Ajustado o espaçamento lateral para caber tudo */
            z-index: 1000;
            background: rgba(158, 35, 35, 0.6); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        /* LOGO COM IMAGEM E TEXTO */
        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            width: 70px;
            height: 70px;
            background-image: url('superman.png');
            background-size: cover;
            background-position: center;
            border-radius: 50%;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            letter-spacing: -1px;
        }

        .logo span {
            color: #ff789a;
        }

        /* 🗺️️ LINKS DE NAVEGAÇÃO */
        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-link:hover {
            color: #fff;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: #9293ff;
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* 🔍 BARRA DE PESQUISA ADICIONADA */
        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 4px 6px 4px 14px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            background: rgba(255, 255, 255, 0.2);
            border-color: #ff789a;
            box-shadow: 0 0 10px rgba(255, 120, 154, 0.3);
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 0.88rem;
            width: 140px;
            transition: width 0.3s ease;
        }

        .search-box input::placeholder {
            color: #cbd5e1;
        }

        /* Expande levemente a caixa ao clicar */
        .search-box input:focus {
            width: 180px;
        }

        .search-box button {
            background: #6366f1;
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .search-box button:hover {
            background: #4f46e5;
        }

        /* SLIDER */
        .slider-container {
            width: 50%;
            overflow: hidden; 
            border-radius: 50px;
            margin: 120px auto 50px auto; /* Ajustado para não ficar atrás do cabeçalho fixo */
        }

        .slider {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        .slide {
            min-width: 100%;
            aspect-ratio: 16 / 9;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Estrutura do Cabeçalho -->
    <header class="custom-header">
        
        <!-- Logo + Imagem do Superman -->
        <div class="header-brand">
            <div class="logo-img"></div>
            <a href="#" class="logo">
                <span>smallville</span>fan/base
            </a>
        </div>

        <!-- Links de Navegação -->
        <nav>
            <ul class="nav-menu">
                <li><a href="inde2.html" class="nav-link">Início</a></li>
                <li><a href="index3.html" class="nav-link">Projetos</a></li>
                <li><a href="index4.html" class="nav-link">Serviços</a></li>
                <li><a href="index5.html" class="nav-link">Sobre</a></li>
            </ul>
        </nav>

        <!-- Formulário da Barra de Pesquisa -->
        <form action="#" method="GET" class="search-box">
            <input type="text" name="q" placeholder="Buscar..." required />
            <button type="submit">Buscar</button>
        </form>

    </header>

    <script>
        const slider = document.getElementById('slider');
        let index = 1;

        function moverSlider() {
            if (!slider) return;
            index++;
            if (index >= 7) index = 1;
            slider.style.transform = `translateX(${-index * 100}%)`;
        }

        setInterval(moverSlider, 3000);
    </script>
    <h1>meu pau
        
    </h1>
</body>
</html>
