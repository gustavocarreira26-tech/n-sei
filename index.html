<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <header>
        <img src="" alt="">
      <style>
        header {
  display: flex;
  justify-content: space-between; /* Separa os itens para as pontas */
  align-items: center;            /* Alinha os itens verticalmente no centro */
  padding: 10px 20px;
}

.canto-logo {
  width: 5px; /* Ajuste o tamanho da imagem conforme necessário */
  height: auto;
}



        /* RESET DE ESTILOS PADRÃO */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b); /* Fundo escuro estético para contraste */
            height: 200vh; /* Altura extra apenas para testar a rolagem da página */
        }

        /* 👑 ESTILIZAÇÃO DO CABEÇALHO */
        .custom-header {
            position: fixed; /* Mantém o cabeçalho fixo no topo ao rolar a página */
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between; /* Separa Logo, Menu e Botão */
            align-items: center;
            padding: 1.25rem 10%; /* Espaçamento interno premium */
            z-index: 1000;
            
            /* Efeito Glassmorphism (Transparência + Desfoque) */
            background: rgba(158, 35, 35, 0.6); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 2cap transparent hwb(0 0% 100% / 0.877);
            
            transition: all 0.3s ease;
        }

        /* 🏷️ LOGO */
        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: #ff789a; /* Detalhe colorido no logo (Indigo) */
        }

        /* 🗺️ LINKS DE NAVEGAÇÃO */
        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2.5rem; /* Espaço generoso entre os links */
        }

        .nav-link {
            color: #94a3b8; /* Cor cinza elegante para links inativos */
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
            position: relative;
        }

        /* Efeito de hover suave */
        .nav-link:hover {
            color: #fff;
        }

        /* Linha estética animada embaixo do link ao passar o mouse */
        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: #9293ff;
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* 🚀 BOTÃO CALL TO ACTION (CTA) */
        .cta-button {
            background: #6366f1;
            color: #fff;
            padding: 0.6rem 1.4rem;
            border-radius: 50px; /* Bordas totalmente arredondadas */
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
            transition: all 0.3s ease;
        }

        .cta-button:hover {
            background:transparent;
            transform: translateY(-2px); /* Efeito flutuante leve */
            box-shadow: 0 6px 20px rgba(219, 162, 115, 0.4);
        }
        h1{
            color: #fff;

        }
        .slider-container {
    width: 50%;           /* Ocupa menos que a metade */
    overflow: hidden; 
    border-radius: 50px;
    margin: 50px 0;      /* Alinhado à esquerda por padrão */
  }

  .slider {
    display: flex;
    transition: transform 0.5s ease-in-out; /* Define a suavidade do movimento */
  }

  .slide {
    min-width: 100%;      /* Garante que cada slide preencha o container de 40% */
    aspect-ratio: 16 / 9;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>




        
    </style>
<body>

    <!-- Estrutura Semântica do Cabeçalho -->
    <header class="custom-header">
        <a href="#" class="logo">smallville<span>fan/base</span></a>
        
        <nav>
            <ul class="nav-menu">
                <li><a href="inde2.html" class="nav-link">Início</a></li>
                <li><a href="index3.html" class="nav-link">Projetos</a></li>
                <li><a href="index4.html" class="nav-link">Serviços</a></li>
                <li><a href="index5.html" class="nav-link">Sobre</a></li>
            </ul>
        </nav>
        
        <a href="#" class="cta-button">Contato</a>
    </header>
    <script>
        const slider = document.getElementById('slider');
        let index = 0;
      
        function moverSlider() {
          index++;
          if (index >= 7) index = 0; // Volta para o primeiro após o último
          
          // Move o slider para a esquerda baseado no índice
          slider.style.transform = `translateX(${-index * 100}%)`;
        }
      
        // Muda de slide a cada 3 segundos
        setInterval(moverSlider, 3000);
      </script>

</body>
